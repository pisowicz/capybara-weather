name: Deploy to GitHub Pages

# The default workflow token isn't allowed to enable/manage the Pages site
# via the Pages API on this account, so we publish the classic way instead:
# mirror main to the gh-pages branch, which Pages serves directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: git push --force origin HEAD:gh-pages
